<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>統計ラボ — 偶然の、その先へ。</title><link rel="stylesheet" href="style.css"></head><body><header><a href="../" class="brand"><span class="logo">▥</span> 統計ラボ <small>STATISTICS STUDIO</small></a><span>予想して、動かして、発見しよう。</span><a href="../" class="back">かたちラボへ ↗</a></header><nav id="tabs" aria-label="学習テーマ"></nav><main><aside><div class="eyebrow">LEARN BY EXPERIMENTING</div><h1 id="title"></h1><p id="question" class="muted"></p><div class="rule"></div><form id="controls"></form><p id="error" role="alert"></p><details><summary>数式・計算方法を見る</summary><div id="method"></div></details></aside><section class="workspace"><div class="viewbar"><strong id="chartTitle"></strong><span class="badge">INTERACTIVE LAB</span></div><div class="chart"><canvas id="canvas" aria-label="統計グラフ"></canvas></div><div id="metrics" class="metrics" aria-live="polite"></div><section class="transport" aria-label="実験の操作"><div class="playrow"><button id="play" class="play">▶ 再生</button><button id="step">1ステップ</button><button id="reset">↺ 最初から</button><label>速さ <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="3">3×</option></select></label></div><div class="batch"><button data-count="1">1回実験</button><button data-count="10">10回実験</button><button data-count="100">100回実験</button><label><input id="reduced" type="checkbox"> 動きを減らす</label><label>乱数シード <input id="seed" type="number" value="2026" min="0" max="4294967295"></label></div><p id="stage" aria-live="polite"></p></section><section class="insight"><span>✧</span><div><strong id="insightTitle">観察から、発見へ。</strong><p id="explanation"></p></div></section><details class="learn"><summary>読み取りのヒント・前提条件</summary><div id="notes"></div></details><footer>ブラウザ内で計算・データの外部送信なし <span>統計ラボ / 高校数学とその先へ</span></footer></section></main><script src="stats.js"></script><script src="app.js"></script></body
